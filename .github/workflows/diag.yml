name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Inspect failed deploy
        env:
          RPC: https://rpc.mainnet.chain.robinhood.com
          ADDR: "0xdBC844C1D92d99303EEf6Cd853BcF82BBE505E6B"
        run: |
          set +e
          J=$(curl -s "https://robinhoodchain.blockscout.com/api/v2/addresses/$ADDR/transactions")
          echo "$J" | head -c 3000
          H=$(echo "$J" | jq -r '.items[0].hash')
          echo "::notice title=hash::$H"
          echo "$J" | jq -c '.items[] | {hash, status, result, gas_limit, gas_used, gas_price, created_contract: .created_contract.hash, revert_reason, method}' | while read l; do echo "::notice title=tx::$l"; done
          R=$(cast receipt $H --rpc-url $RPC --json)
          echo "::notice title=receipt::$(echo $R | jq -c '{status,gasUsed,cumulativeGasUsed,gasUsedForL1,effectiveGasPrice,contractAddress}')"
          T=$(cast tx $H --rpc-url $RPC --json)
          echo "::notice title=tx-gas::$(echo $T | jq -c '{gas,maxFeePerGas,maxPriorityFeePerGas,type}') inputlen=$(echo $T | jq -r '.input' | wc -c)"
          INPUT=$(echo $T | jq -r '.input')
          echo "::notice title=balance::$(cast balance $ADDR --rpc-url $RPC --ether)"
          EST=$(cast estimate --from $ADDR --rpc-url $RPC --create $INPUT 2>&1 | tail -3)
          echo "::notice title=estimate-now::$EST"
          CALL=$(cast call --from $ADDR --rpc-url $RPC --create $INPUT 2>&1 | tail -3 | cut -c1-300)
          echo "::notice title=simulate-now::$CALL"
          RUN=$(cast run $H --rpc-url $RPC 2>&1 | tail -15 | tr '\n' ' ' | cut -c1-900)
          echo "::notice title=trace::$RUN"
          echo "::notice title=chain::$(cast chain-id --rpc-url $RPC) block=$(cast block-number --rpc-url $RPC)"
