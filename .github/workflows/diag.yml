name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Live mint state
        env:
          RPC: https://rpc.mainnet.chain.robinhood.com
          T: "0xcc49765a547f1ea605228846365b74e10cf46214"
          NFT: "0x83c126042B40F45Cc0be74335a5b8e47f44709e9"
          DEAD: "0x000000000000000000000000000000000000dEaD"
        run: |
          set +e
          n(){ echo "::notice title=$1::$2"; }
          c(){ cast call $NFT "$@" --rpc-url $RPC 2>&1 | tr '\n' ' '; }
          n open "$(c 'mintOpen()(bool)')"
          n token "$(c 'paymentToken()(address)') locked=$(c 'paymentTokenLocked()(bool)')"
          n minted "$(c 'totalMinted()(uint256)') burned=$(c 'totalBurned()(uint256)')"
          n tiers "$(c 'priceTiers()(uint256[],uint256[])')"
          n price "current=$(c 'currentPrice()(uint256)') quote5=$(c 'quote(uint256)(uint256)' 5)"
          n limit "$(c 'walletLimit()(uint256)') revealed=$(c 'revealed()(bool)')"
          n dead "$(cast call $T 'balanceOf(address)(uint256)' $DEAD --rpc-url $RPC)"
