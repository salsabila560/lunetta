name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Find Lunetta deploys owned by the Bitget wallet
        env:
          RPC: https://rpc.mainnet.chain.robinhood.com
          OWNER: "dbc844c1d92d99303eef6cd853bcf82bbe505e6b"
        run: |
          set +e
          HI=$(cast block-number --rpc-url $RPC)
          echo "::notice title=head::$HI"
          FOUND=0
          for B in $(seq $HI -1 $((HI-3500))); do
            cast rpc eth_getBlockByNumber $(printf '0x%x' $B) true --rpc-url $RPC \
              | jq -r --arg o "$OWNER" '.transactions[] | select(.to==null) | select((.input|ascii_downcase)|contains($o)) | "\(.hash) \(.from) \(.nonce) \(.gas)"' > /tmp/hits
            while read H F N G; do
              [ -z "$H" ] && continue
              FOUND=$((FOUND+1))
              S=$(cast receipt $H status --rpc-url $RPC); C=$(cast receipt $H contractAddress --rpc-url $RPC); U=$(cast receipt $H gasUsed --rpc-url $RPC)
              L=$(cast code $C --rpc-url $RPC | wc -c)
              echo "::notice title=deploy$FOUND::block=$B hash=$H from=$F nonce=$N gaslimit=$G used=$U status=$S contract=$C codelen=$L"
              if [ "$L" -gt 10 ]; then echo "::notice title=state$FOUND::owner=$(cast call $C 'owner()(address)' --rpc-url $RPC) minted=$(cast call $C 'totalMinted()(uint256)' --rpc-url $RPC) open=$(cast call $C 'mintOpen()(bool)' --rpc-url $RPC) token=$(cast call $C 'paymentToken()(address)' --rpc-url $RPC)"; fi
            done < /tmp/hits
          done
          echo "::notice title=total::$FOUND deploy tx found in last 3500 blocks"
