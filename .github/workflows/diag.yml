name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check deploy at nonce 3
        env:
          RPC: https://rpc.mainnet.chain.robinhood.com
          ADDR: "0xdBC844C1D92d99303EEf6Cd853BcF82BBE505E6B"
        run: |
          set +e
          A=$(echo $ADDR | tr A-Z a-z)
          TARGET=$(date -d '2026-10-14 10:46:30 UTC' +%s)
          LO=88288523; HI=$(cast block-number --rpc-url $RPC)
          while [ $((HI-LO)) -gt 1 ]; do MID=$(((LO+HI)/2)); TS=$(cast block $MID timestamp --rpc-url $RPC); if [ $TS -lt $TARGET ]; then LO=$MID; else HI=$MID; fi; done
          echo "::notice title=start::$LO"
          H=""
          for B in $(seq $LO $((LO+1500))); do
            R=$(cast rpc eth_getBlockByNumber $(printf '0x%x' $B) true --rpc-url $RPC | jq -r --arg a "$A" '.transactions[] | select((.from|ascii_downcase)==$a) | .hash')
            if [ -n "$R" ]; then H=$R; echo "::notice title=found::block $B $H"; break; fi
          done
          RUN=$(cast run $H --rpc-url $RPC 2>&1 | grep -v "^\s*$" | tail -8 | tr '\n' ' ' | cut -c1-600)
          echo "::notice title=trace::$RUN"
          echo "::notice title=txgas::$(cast tx $H gas --rpc-url $RPC) used=$(cast receipt $H gasUsed --rpc-url $RPC) status=$(cast receipt $H status --rpc-url $RPC)"
          echo "::notice title=nonce::$(cast nonce $ADDR --rpc-url $RPC)"
          for N in 3 4; do
            C=$(cast compute-address --nonce $N $ADDR | awk '{print $NF}')
            L=$(cast code $C --rpc-url $RPC | wc -c)
            echo "::notice title=nonce$N::$C codelen=$L"
            if [ "$L" -gt 10 ]; then
              echo "::notice title=state$N::owner=$(cast call $C 'owner()(address)' --rpc-url $RPC) max=$(cast call $C 'maxSupply()(uint256)' --rpc-url $RPC) open=$(cast call $C 'mintOpen()(bool)' --rpc-url $RPC) tiers=$(cast call $C 'priceTiers()(uint256[],uint256[])' --rpc-url $RPC | tr '\n' ' ')"
            fi
          done
          echo "::notice title=balance::$(cast balance $ADDR --rpc-url $RPC --ether)"
          echo "::notice title=cors::$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://lunetta.fun' -H 'Access-Control-Request-Method: POST' $RPC) $(curl -s -D - -o /dev/null -X POST -H 'Origin: https://lunetta.fun' -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' $RPC | grep -i 'access-control' | tr '\r\n' '  ')"
