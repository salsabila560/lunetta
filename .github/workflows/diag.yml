name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Browser check of /mint
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:420,height:900}});
          const out=[];const log=(s)=>{out.push(s);};
          p.on('console',m=>{ if(m.type()==='error'||m.type()==='warning') log('CONSOLE '+m.type()+' '+m.text().slice(0,250))});
          p.on('pageerror',e=>log('PAGEERR '+e.message.slice(0,250)));
          p.on('request',r=>{const u=r.url(); if(!u.includes('lunetta.fun')&&!u.includes('fonts')) log('REQ '+r.method()+' '+u.slice(0,90)+' '+(r.postData()||'').slice(0,140))});
          p.on('response',async r=>{const u=r.url(); if(u.includes('rpc')||u.includes('chain')){let t='';try{t=(await r.text()).slice(0,200)}catch{} log('RES '+r.status()+' '+u.slice(0,60)+' '+t)}});
          p.on('requestfailed',r=>log('FAIL '+r.url().slice(0,100)+' '+(r.failure()&&r.failure().errorText)));
          await p.goto('https://lunetta.fun/mint',{waitUntil:'domcontentloaded'});await p.waitForTimeout(15000);
          log('TEXT '+(await p.innerText('main')).slice(0,300).replace(/\n/g,' | '));
          for (const l of out.slice(0,40)) console.log('::notice::'+l.replace(/\r?\n/g,' '));
          await b.close();})();
          JS
          node c.js
