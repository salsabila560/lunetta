name: Diag deploy
on:
  push:
    branches: [diag-deploy]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Browser check of /mint
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > c.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:420,height:900}});
          const out=[];const log=(s)=>{out.push(s);};
          p.on('console',m=>{ if(m.type()==='error'||m.type()==='warning') log('CONSOLE '+m.type()+' '+m.text().slice(0,250))});
          p.on('pageerror',e=>log('PAGEERR '+e.message.slice(0,250)));
          
          p.on('response',async r=>{const u=r.url(); if(u.includes('rpc')){let t='';try{t=(await r.text())}catch{} if(t.includes('error')) log('RPCERR '+t.slice(0,250))}});
          p.on('request',r=>{const u=r.url(); if(u.includes('rpc')) log('REQ '+u.slice(0,60))});
          p.on('requestfailed',r=>log('FAIL '+r.url().slice(0,100)+' '+(r.failure()&&r.failure().errorText)));
          await p.goto('https://lunetta.fun/mint',{waitUntil:'domcontentloaded'});await p.waitForTimeout(15000); await p.screenshot({path:'m.png'});
          log('TEXT '+(await p.innerText('body')).slice(0,900).replace(/\n/g,' | '));
          const reqs=out.filter(l=>l.startsWith('REQ ')); const counts={}; reqs.forEach(l=>counts[l]=(counts[l]||0)+1); console.log('::notice::'+JSON.stringify(counts)); for (const l of out.filter(l=>!l.startsWith('REQ ')).slice(0,30)) console.log('::notice::'+l.replace(/\r?\n/g,' '));
          await b.close();})();
          JS
          node c.js
